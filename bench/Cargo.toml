[package]
name = "bench"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Without this feature the program links the builtins that `cargo build-sbpf` provides by default.
pr = ["dep:solana-compiler-builtins"]

[dependencies]
helper = { path = "helper" }
solana-compiler-builtins = { path = "..", optional = true }

[dev-dependencies]
mollusk-svm = "=0.16.0"
solana-instruction = "3.4.0"

[workspace]
